{% extends "base.html" %}
{% block title %}Eliminar proyecto{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card shadow-sm border-danger">
            <div class="card-body p-4">
                <h1 class="h3">Eliminar proyecto</h1>
                <p>¿Estás segura de que deseas eliminar <strong>{{ object.nombre }}</strong>?</p>
                <p class="text-danger">También se eliminarán sus tareas asociadas.</p>

                <form method="POST">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Sí, eliminar</button>
                    <a href="{% url 'proyectos:detalle' object.pk %}" class="btn btn-outline-secondary">
                        Cancelar
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
