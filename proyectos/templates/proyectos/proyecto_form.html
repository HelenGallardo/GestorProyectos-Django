{% extends "base.html" %}
{% block title %}Proyecto{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 mb-4">
                    {% if object %}Editar proyecto{% else %}Nuevo proyecto{% endif %}
                </h1>

                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Guardar</button>
                        <a href="{% url 'proyectos:lista' %}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
